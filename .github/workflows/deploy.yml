deploy:
  needs: test
  runs-on: ubuntu-latest
  steps:
    - name: Build production assets
      run: pnpm run build # 生成 .output

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /app
          # 停止并清理旧容器
          docker stop nuxt-app || true
          docker rm nuxt-app || true

          # 从 CI 工作目录直接构建镜像（关键！）
          docker build -t nuxt-app:latest $GITHUB_WORKSPACE

          # 启动新容器（绑定 3000 端口）
          docker run -d --name nuxt-app -p 3000:3000 nuxt-app:latest

          # 健康检查（Nginx 会代理到此端口）
          sleep 10
          if ! curl -f http://localhost:3000; then
            echo "❌ 应用启动失败！"
            docker stop nuxt-app
            docker rm nuxt-app
            exit 1
          fi
          echo "✅ 应用部署成功！"
